services:
  db:
    container_name: evaluation_sqlserver-service
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: 12345
      MSSQL_DATABASE: dbEvaluation
  adminer:
    container_name: evaluation_adminer
    image: adminer
    restart: unless-stopped
    ports:
      - "9001:8080"
  mongo:
    image: mongo:6.0
    container_name: jamongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 12345
    ports:
      - "27017:27017"