spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: Evaluation

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  datasource:
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};encrypt=true;trustServerCertificate=true;databaseName=${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  web:
    base-path: /api/v1/
    cors:
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid, email, roles, ip, userId, web-origins, P_MU_C, profile, objectKeys
            authorization-grant-type: authorization_code
            redirect-uri: ${KEYCLOAK_REDIRECT_URI}/login/oauth2/code/keycloak
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_SERVER}/auth/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_SERVER}/auth/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_SERVER}/auth/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/userinfo

  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
    contexts: dev
    default-schema: dbo
    drop-first: false
    liquibase-schema: dbo
    database-change-log-table: DATABASECHANGELOG
    database-change-log-lock-table: DATABASECHANGELOGLOCK

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER}/eureka/
    fetch-registry: true
    register-with-eureka: true
    enabled: true

server:
  port: ${BACKEND_SERVER_PORT}

  error:
    whitelabel:
      enabled: false

keycloak:
  logout-url: ${KEYCLOAK_SERVER}/auth/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/logout
  back-logout: ${BACKEND_HOST}/logout
  login: ${BACKEND_HOST}
  public-key-url: ${KEYCLOAK_SERVER}/auth/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/certs


evaluation:
  requestQueueSuffix: ${requestQueueSuffix}
  responseQueueSuffix: ${responseQueueSuffix}
  defaultPageSize: 9000
  defaultPageNumber: 0
  typeOfPersonnelDTOSending: ${typeOfPersonnelDTOSending}
  typeOfBasePersonnelDTOSending: ${typeOfBasePersonnelDTOSending}
  typeOfPersonnelDTOWithManagerSending: ${typeOfPersonnelDTOWithManagerSending}
  consumerName: ${consumerName}
  timeout: ${timeout}



objectKey:
  serviceRoleKey: ${serviceRoleKey}